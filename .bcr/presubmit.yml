bcr_test_module:
  module_path: ""
  matrix:
    platform:
      - ubuntu-22.04
      - macos-15
    bazel:
      - 8.x
  tasks:
    run_tests:
      name: "Build and test (excluding OCI on macOS)"
      build_targets:
        - "//..."
      build_flags:
        - "--build_tag_filters=-oci"
      test_targets:
        - "//..."
      test_flags:
        - "--test_tag_filters=-docker,-oci"

bcr_test_module_linux:
  module_path: ""
  matrix:
    platform:
      - ubuntu-22.04
    bazel:
      - 8.x
  tasks:
    run_all:
      name: "Build and test everything (Linux)"
      build_targets:
        - "//..."
      test_targets:
        - "//..."
