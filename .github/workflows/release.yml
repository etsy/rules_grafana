name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release archive
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          git archive --format=tar.gz --prefix=rules_grafana-${TAG}/ HEAD > rules_grafana-${TAG}.tar.gz
          sha256sum rules_grafana-${TAG}.tar.gz > rules_grafana-${TAG}.tar.gz.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rules_grafana-*.tar.gz
            rules_grafana-*.tar.gz.sha256
          generate_release_notes: true
        # The Publish to BCR GitHub App will automatically detect this
        # release and create a PR to the BCR
