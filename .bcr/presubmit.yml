bcr_test_module_linux:
  module_path: ""
  matrix:
    platform:
      - ubuntu-22.04
    bazel:
      - 8.x
  tasks:
    build_and_test:
      name: "Build and test all"
      build_targets:
        - "//..."
      test_targets:
        - "//..."

bcr_test_module_macos:
  module_path: ""
  matrix:
    platform:
      - macos-15
    bazel:
      - 8.x
  tasks:
    build_and_test:
      name: "Build and test (no Docker)"
      build_targets:
        - "//..."
      test_targets:
        - "//..."
      test_flags:
        # Docker not available on GitHub macOS runners
        # https://github.com/actions/runner/issues/1456
        - "--test_tag_filters=-docker"
