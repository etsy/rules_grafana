bcr_test_module:
  module_path: ""
  matrix:
    platform:
      - ubuntu-22.04
      - macos-15
    bazel:
      - 8.x
  tasks:
    build_all:
      name: "Build all targets"
      build_targets:
        - "//..."
    # Docker tests excluded because GitHub macOS runners don't have Docker
    # https://github.com/actions/runner/issues/1456
    test_non_docker:
      name: "Test (excluding docker tests)"
      test_targets:
        - "//..."
      test_flags:
        - "--test_tag_filters=-docker"

bcr_test_module_linux:
  module_path: ""
  matrix:
    platform:
      - ubuntu-22.04
    bazel:
      - 8.x
  tasks:
    test_docker:
      name: "Test docker targets (Linux only)"
      test_targets:
        - "//..."
      test_flags:
        - "--test_tag_filters=docker"
