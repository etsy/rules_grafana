name: CI

on:
  push:
    branches: [main, grafana-foundation-sdk]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bazel: ["7.4.1", "8.0.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-version: "1.25.0"
          disk-cache: ${{ github.workflow }}-${{ matrix.bazel }}
          repository-cache: ${{ github.workflow }}

      - name: Build
        run: bazel build //...
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}

      - name: Test
        run: bazel test //...
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}

